<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen p-4">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700 max-w-md w-full text-center">
        <h2 class="text-2xl font-bold mb-4">¿Confirmar Entrega?</h2>
        <p class="text-gray-400 mb-6">Vas a marcar la <strong>Orden #{{ orden.id }}</strong> de <strong>{{ orden.cliente_nombre }}</strong> como entregada.</p>
        
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-xl text-lg mb-3 transition transform active:scale-95">
                SÍ, ENTREGAR AHORA
            </button>
            <a href="{% url 'orden_list' %}" class="block text-gray-400 hover:text-white text-sm font-medium">
                Cancelar y volver
            </a>
        </form>
    </div>
</body>
</html>
